<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Joaquín Alarcón Berríos — Product Owner, AI and Innovation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#132238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Workflow motif: manual steps converging into an automated pipeline -->
  <g transform="translate(800 60)" fill="none" stroke-linecap="round">
    <path d="M40 40 C120 40 120 100 200 100" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M40 100 L200 100" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M40 160 C120 160 120 100 200 100" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M200 100 L340 100" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M200 100 C280 100 280 40 340 40" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M200 100 C280 100 280 160 340 160" stroke="#818CF8" stroke-opacity="0.7" stroke-width="2"/>
  </g>
  <g transform="translate(800 60)">
    <circle cx="40" cy="40" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="40" cy="100" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="40" cy="160" r="7" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="182" y="82" width="36" height="36" rx="9" fill="#0F172A" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="200" cy="100" r="5" fill="#38BDF8"/>
    <circle cx="340" cy="40" r="7" fill="#818CF8"/>
    <circle cx="340" cy="100" r="7" fill="#818CF8"/>
    <circle cx="340" cy="160" r="7" fill="#818CF8"/>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="84" width="48" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="140" fill="#F8FAFC" font-size="44" font-weight="700" letter-spacing="-0.5">Joaquín Alarcón Berríos</text>
    <text x="72" y="182" fill="#38BDF8" font-size="20" font-weight="600" letter-spacing="0.5">PRODUCT OWNER  ·  AI &amp; INNOVATION</text>
    <text x="72" y="222" fill="#94A3B8" font-size="18">Process automation, operational scalability and data-driven products</text>
    <text x="72" y="250" fill="#94A3B8" font-size="18">for logistics, mining and HealthTech.</text>
  </g>
</svg>
